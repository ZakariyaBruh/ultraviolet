<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blocked page</title>
<style>
  :root { --ground: #070b12; --ink: #e9eef7; --ink-2: #aab4c6; --signal: #ffd23f; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--ground); color: var(--ink); font: 16px/1.45 "Hanken Grotesk", system-ui, sans-serif; text-align: center; }
  main { max-width: 34ch; }
  p.k { margin: 0 0 12px; color: var(--signal); font: 600 13px/1 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
  h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.2; }
  p { margin: 0; color: var(--ink-2); }
</style>
</head>
<body>
<main>
  <p class="k">Friction</p>
  <h1>That page is blocked</h1>
  <p>It is on the blocked list (games and short-form feeds), so it was closed. Type another address above.</p>
</main>
</body>
</html>
