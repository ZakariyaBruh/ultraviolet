<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friction cloud browser</title>
<style>html,body{height:100%;margin:0;background:#0b0e13;color:#e8eaf0;font:15px/1.45 system-ui,sans-serif}#m{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:16px}#m.e{color:#ffb4a8}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}</style></head>
<body><p id="m">Starting the cloud browser…</p>
<script src="/baremux/index.js"></script>
<script src="/scram/scramjet.all.js"></script>
<script>
(async () => {
  const m = document.getElementById('m')
  const fail = (t) => { m.className = 'e'; m.textContent = t }
  try {
    const q = new URLSearchParams(location.search)
    const u = q.get('u') || ''
    const t = q.get('t') || ''
    if (!/^https?:\/\//i.test(u) || !/^\d{10}\.[\w-]{32}$/.test(t)) return fail('This page is only opened from inside Friction.')
    if (!('serviceWorker' in navigator)) {
      // some browsers (Safari with cross-site tracking prevention) give no service workers to a page inside another site
      fail('This browser will not run the cloud browser inside Friction. ')
      if (window.top !== window) { const a = document.createElement('a'); a.href = location.href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open it in its own tab (this leaves Friction)'; a.style.color = '#ffd84a'; m.append(a) }
      return
    }
    // the controller sets up Scramjet's storage, which the worker reads, so it comes first
    const { ScramjetController } = $scramjetLoadController()
    // lighter rewriting (no source maps, no try/catch around every script) so heavy sites use less memory and time on a slow device
    const flags = q.get('heavy') === '1' ? {} : { sourcemaps: false, captureErrors: false }
    const scramjet = new ScramjetController({ files: { wasm: '/scram/scramjet.wasm.wasm', all: '/scram/scramjet.all.js', sync: '/scram/scramjet.sync.js' }, flags })
    await scramjet.init()
    const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' })
    const sw = reg.installing || reg.waiting || reg.active
    if (sw && sw.state !== 'activated') await new Promise((done) => sw.addEventListener('statechange', () => { if (sw.state === 'activated') done() }))
    // the socket to the relay carries this pass; a new pass on every start replaces the old transport
    const connection = new BareMux.BareMuxConnection('/baremux/worker.js')
    await connection.setTransport('/libcurl/index.mjs', [{ websocket: (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/wisp/' + t + '/' }])
    const frame = scramjet.createFrame()
    m.remove()
    document.body.appendChild(frame.frame)
    frame.go(u)
  } catch (e) { fail('The cloud browser could not start: ' + (e && e.message ? e.message : e)) }
})()
</script></body></html>
