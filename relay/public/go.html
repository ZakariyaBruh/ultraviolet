<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friction cloud browser</title>
<style>html,body{height:100%;margin:0;background:#0b0e13;color:#e8eaf0;font:15px/1.45 system-ui,sans-serif}#m{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:16px}#m.e{color:#ffb4a8}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}body.own iframe{top:44px;height:calc(100% - 44px)}#bar{display:none;position:fixed;inset:0 0 auto 0;height:44px;align-items:center;gap:10px;padding:0 10px;background:#0b0e13;border-bottom:1px solid #2a3140;font-size:13px;z-index:2}body.own #bar{display:flex}#bar button{height:32px;padding:0 12px;border:1px solid #4a5568;background:transparent;color:#e8eaf0;font:inherit;font-weight:600}#bar b{color:#ffd84a}#bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style></head>
<body><div id="bar"><button id="back" type="button">Back to Friction</button><span>Cloud browser, in its own tab. Time left today <b id="left"></b></span></div><p id="m">Starting the cloud browser…</p>
<script src="/baremux/index.js"></script>
<script src="/scram/scramjet.all.js"></script>
<script>
(async () => {
  const m = document.getElementById('m')
  const fail = (t) => { m.className = 'e'; m.textContent = t }
  try {
    const q = new URLSearchParams(location.search)
    const u = q.get('u') || ''
    const t = q.get('t') || ''
    // opened by Friction in a tab of its own: a page that freezes can then only freeze this tab. Friction is told when this tab is
    // being looked at, so that being here is not counted as wandering off, and a top bar says how to get back.
    const opener = window.opener
    if (window.top === window && opener) {
      try { window.opener = null } catch (e) { /* the page being proxied must not reach Friction through it */ }
      document.body.className = 'own'
      const tell = (v) => { try { opener.postMessage({ frictionCloud: 1, v, t: Date.now() }, 'https://frictionx.vercel.app') } catch (e) { /* Friction was closed */ } }
      const end = Number(t.split('.')[0]) * 1000
      const spare = Number(q.get('left')) || 0
      const clock = () => { const n = Math.max(0, Math.round((end - Date.now()) / 1000) + spare); document.getElementById('left').textContent = Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0') }
      clock(); setInterval(clock, 1000)
      tell(document.visibilityState === 'visible')
      setInterval(() => { if (document.visibilityState === 'visible') tell(true) }, 5000)
      document.addEventListener('visibilitychange', () => tell(document.visibilityState === 'visible'))
      addEventListener('pagehide', () => tell(false))
      document.getElementById('back').onclick = () => { try { opener.focus() } catch (e) { /* switch tabs by hand */ } try { window.close() } catch (e) { /* not allowed */ } }
    }
    if (!/^https?:\/\//i.test(u) || !/^\d{10}\.[\w-]{32}$/.test(t)) return fail('This page is only opened from inside Friction.')
    if (!('serviceWorker' in navigator)) {
      // some browsers (Safari with cross-site tracking prevention) give no service workers to a page inside another site
      fail('This browser will not run the cloud browser inside Friction. ')
      if (window.top !== window) { const a = document.createElement('a'); a.href = location.href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open it in its own tab (this leaves Friction)'; a.style.color = '#ffd84a'; m.append(a) }
      return
    }
    // the controller sets up Scramjet's storage, which the worker reads, so it comes first
    const { ScramjetController } = $scramjetLoadController()
    // lighter rewriting (no source maps, no try/catch around every script) so heavy sites use less memory and time on a slow device
    const flags = q.get('heavy') === '1' ? {} : { sourcemaps: false, captureErrors: false }
    const scramjet = new ScramjetController({ files: { wasm: '/scram/scramjet.wasm.wasm', all: '/scram/scramjet.all.js', sync: '/scram/scramjet.sync.js' }, flags })
    await scramjet.init()
    const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' })
    const sw = reg.installing || reg.waiting || reg.active
    if (sw && sw.state !== 'activated') await new Promise((done) => sw.addEventListener('statechange', () => { if (sw.state === 'activated') done() }))
    // the socket to the relay carries this pass; a new pass on every start replaces the old transport
    const connection = new BareMux.BareMuxConnection('/baremux/worker.js')
    await connection.setTransport('/libcurl/index.mjs', [{ websocket: (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/wisp/' + t + '/' }])
    const frame = scramjet.createFrame()
    m.remove()
    document.body.appendChild(frame.frame)
    frame.go(u)
  } catch (e) { fail('The cloud browser could not start: ' + (e && e.message ? e.message : e)) }
})()
</script></body></html>
