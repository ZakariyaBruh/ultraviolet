<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta name="description" content="Anti-scroll. Pro attention span. One screen, no feed. Stay with internet radio or live TV while every scroll you skip is counted." />
    <title>Anti-Scroll</title>
  </head>
  <body>
    <!-- refraction map for lens-shaped glass (Chromium); other engines keep the plain blur -->
    <svg aria-hidden="true" width="0" height="0" style="position:absolute">
      <filter id="lg-refract" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="7" result="n" />
        <feGaussianBlur in="n" stdDeviation="3" result="nb" />
        <feDisplacementMap in="SourceGraphic" in2="nb" scale="26" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
